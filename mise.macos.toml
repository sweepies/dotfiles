# Loaded automatically on macOS via auto_env in .miserc.toml.
# Interactive workstation features do not belong in the shared dev-box config.

[tools]
bat = "latest"
eza = "latest"
dua = "latest"
atuin = "latest"
zoxide = "latest"
fzf = "latest"
tlrc = "latest"
"aqua:remko/age-plugin-se" = "latest"

[dotfile_groups.fish]
root = ".config/fish"
target = "~/.config/fish"
manifest = "git"

[bootstrap.mise_shell_activate]
fish = "activate"

[dotfiles]
"~/.config/mise/config.macos.toml" = { source = "~/dotfiles/mise.macos.toml", mode = "symlink" }

[dotfiles."~/.config/fish/config.fish/integrations"]
block = '''
if status is-interactive
    type -q fnox; and fnox activate fish | source
    type -q pitchfork; and pitchfork activate fish | source
    type -q atuin; and atuin init fish | source
    type -q zoxide; and zoxide init fish --cmd cd | source
end
'''

[shell_alias]
cat = "bat --pager=none"
grep = "rg"
ls = "eza"
vault = "bao"
rand = "pwgen --secure 48 1"
bd = "br"
pf = "pitchfork"
tailscale = "/Applications/Tailscale.app/Contents/MacOS/Tailscale"

[env]
HOMEBREW_AUTO_UPDATE_SECS = 86400
HOMEBREW_NO_INSTALL_CLEANUP = 0
HOMEBREW_BAT = 1
HOMEBREW_NO_ENV_HINTS = 1
HOMEBREW_NO_ANALYTICS = 1
