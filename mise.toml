# Native dotfile groups/entries require mise 2026.10.3 or newer.
min_version = "2026.10.4"

[tools]
nushell = "latest"
age = "latest"
rg = "latest"
rclone = "latest"
node = "latest"
python = "latest"
uv = "latest"
gh = "latest"
fd = "latest"
shfmt = "latest"
pitchfork = "latest"
aube = "latest"
"npm:cf" = "1.0.0-beta.10"
pi = "1.1.0"
"fnox" = "latest"
claude = "2.1.294"
codex = "latest"
yazi = "latest"
"github:tldr-pages/tlrc" = "latest"
awscli = { version = "latest", symlink_bins = "true" }

[env]
# mise pins Claude Code; its self-updater cannot write mise's install prefix.
DISABLE_AUTOUPDATER = "1"

# Shared across the Mac and Linux dev boxes. .miserc.toml enables native platform
# discovery; mise.macos.toml adds the Mac's interactive workstation setup and
# mise.linux.toml adds dev-box shell activation and machine secrets setup.
[dotfile_groups.fnox]
root = ".config/fnox"
target = "~/.config/fnox"
manifest = "git"

[dotfiles]
"~/.config/mise/config.toml" = { source = "~/dotfiles/mise.toml", mode = "symlink" }
# Template mode keeps mise 2026.10.3's dry-run from parsing this early-init
# file as a normal tool config. The source is static; no script is involved.
"~/.config/mise/miserc.toml" = { source = "~/dotfiles/.miserc.toml", mode = "template" }
# Shared defaults go in Git's XDG global file. ~/.gitconfig stays a regular,
# machine-local file that Git reads second (so it wins) and that `git config
# --global` / `gh auth setup-git` write to, keeping this checkout clean.
"~/.config/git/config" = { source = "~/dotfiles/.gitconfig", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "~/dotfiles/.claude/CLAUDE.md", mode = "symlink" }
# Merge only the shared keys: Pi writes machine-local keys (deviceId,
# lastChangelogVersion) to the same file, and those must not be shared.
"~/.pi/agent/settings.json/shared" = { source = "~/dotfiles/.pi/agent/settings.json", merge = true }
"~/.config/billion-context/billion-context.json" = { source = "~/dotfiles/.config/billion-context/billion-context.json", mode = "symlink" }
"~/.pi/agent/extensions/t3-prompt-cleanup.ts" = { source = "~/dotfiles/.pi/agent/extensions/t3-prompt-cleanup/index.ts", mode = "symlink" }
# Link the directory so Pi can resolve the extension's adjacent helper module.
"~/.pi/agent/extensions/t3-tool-discovery" = { source = "~/dotfiles/.pi/agent/extensions/t3-tool-discovery", mode = "symlink" }

# Git writes --global changes to the XDG file (this checkout) unless
# ~/.gitconfig exists, so ensure it is a regular file. Removing the old managed
# symlink into this checkout loses nothing; any other symlink is left alone.
[bootstrap.hooks.post-dotfiles]
run = '''
if [ -L "$HOME/.gitconfig" ] && [ "$HOME/.gitconfig" -ef "$HOME/dotfiles/.gitconfig" ]; then rm "$HOME/.gitconfig"; fi
[ -e "$HOME/.gitconfig" ] || : > "$HOME/.gitconfig"
'''

[tasks."test:pi-prompt-cleanup"]
description = "Test the local T3 prompt-deduplication extension"
dir = "{{env.HOME}}/dotfiles"
run = "node --test .pi/agent/tests/t3-prompt-cleanup.test.ts"

[tasks."test:pi-tool-discovery"]
description = "Test T3 on-demand tool activation and the installed Pi/T3 bridge"
dir = "{{env.HOME}}/dotfiles"
run = "node --test .pi/agent/tests/t3-tool-discovery*.test.ts"

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.relative_symlinks = true
experimental = true
env_cache = true
auto_update = true

[settings.npm]
package_manager = "aube"
