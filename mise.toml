# Native dotfile groups/entries require mise 2026.10.3 or newer.
min_version = "2026.10.4"

[tools]
nushell = "latest"
age = "latest"
rg = "latest"
rclone = "latest"
node = "latest"
python = "latest"
uv = "latest"
gh = "latest"
fd = "latest"
shfmt = "latest"
pitchfork = "latest"
aube = "latest"
"npm:cf" = "1.0.0-beta.10"
pi = "1.1.0"
"fnox" = "latest"
"npm:@upstash/box-cli" = "latest"
entire = "latest"
claude = "2.1.294"
codex = "latest"
yazi = "latest"
"github:tldr-pages/tlrc" = "latest"

# Shared across the Mac and remote dev box. .miserc.toml enables native platform
# discovery; mise.macos.toml adds the Mac's interactive workstation setup.
[dotfile_groups.fnox]
root = ".config/fnox"
target = "~/.config/fnox"
manifest = "git"

[dotfiles]
"~/.config/mise/config.toml" = { source = "~/dotfiles/mise.toml", mode = "symlink" }
# Template mode keeps mise 2026.10.3's dry-run from parsing this early-init
# file as a normal tool config. The source is static; no script is involved.
"~/.config/mise/miserc.toml" = { source = "~/dotfiles/.miserc.toml", mode = "template" }
"~/.gitconfig" = { source = "~/dotfiles/.gitconfig", mode = "symlink" }
# Keep this DIRECTORY symlinked: Entire refuses to replace hooks through it.
"~/.config/git/hooks" = { source = "~/dotfiles/.config/git/hooks", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "~/dotfiles/.claude/CLAUDE.md", mode = "symlink" }
# Merge only the shared keys: Pi writes machine-local keys (deviceId,
# lastChangelogVersion) to the same file, and those must not be shared.
"~/.pi/agent/settings.json/shared" = { source = "~/dotfiles/.pi/agent/settings.json", merge = true }
"~/.config/billion-context/billion-context.json" = { source = "~/dotfiles/.config/billion-context/billion-context.json", mode = "symlink" }
"~/.pi/agent/extensions/t3-prompt-cleanup.ts" = { source = "~/dotfiles/.pi/agent/extensions/t3-prompt-cleanup/index.ts", mode = "symlink" }
# Link the directory so Pi can resolve the extension's adjacent helper module.
"~/.pi/agent/extensions/t3-tool-discovery" = { source = "~/dotfiles/.pi/agent/extensions/t3-tool-discovery", mode = "symlink" }

[tasks."entire:checkpoints"]
description = "Route this enabled repository's Entire checkpoints to the private shared store"
dir = "{{cwd}}"
run = '''
set -eu
hooks=$(git rev-parse --path-format=absolute --git-common-dir)/hooks
# The Git shell alias scopes config for Entire's child Git commands without
# replacing the caller's GIT_CONFIG_COUNT / GIT_CONFIG_PARAMETERS environment.
git -c core.hooksPath="$hooks" \
  -c 'alias.entire-checkpoint-enroll=!entire configure --local --checkpoint-remote github:sweepies/entire-checkpoints' \
  entire-checkpoint-enroll
'''

[tasks."entire:cli"]
description = "Run Entire lifecycle commands without changing the shared Git hooks"
dir = "{{cwd}}"
run = '''
set -eu
hooks=$(git rev-parse --path-format=absolute --git-common-dir)/hooks
git -c core.hooksPath="$hooks" -c 'alias.entire-local=!entire' entire-local "$@"
'''

[tasks."git:hooks:audit"]
description = "Report local/worktree hook-path overrides and verify the global dispatcher"
dir = "{{cwd}}"
run = "python3 $HOME/.config/git/hooks/audit.py"

[tasks."test:git-hooks"]
description = "Test global Git dispatch and private checkpoint push enforcement"
dir = "{{env.HOME}}/dotfiles"
run = 'ENTIRE_TEST_BINARY="$(mise which entire)" MISE_TEST_BINARY="$(command -v mise)" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .config/git/tests -v'

# Entire's uninstall follows a directory link and removes marked hook files.
# Protect the shared entrypoints from that too. Remote-agent scopes its native
# repo updater's writable window with a cleanup trap; manual pulls must unlock
# first and reapply dotfiles afterward. Standalone repo commands run no hooks.
[bootstrap.hooks.post-dotfiles]
run = 'chmod a-w "$HOME/dotfiles/.config/git/hooks"'

[bootstrap.hooks.post-tools]
run = 'mise exec -- python3 "$HOME/.config/git/hooks/audit.py"'

[tasks."test:pi-prompt-cleanup"]
description = "Test the local T3 prompt-deduplication extension"
dir = "{{env.HOME}}/dotfiles"
run = "node --test .pi/agent/tests/t3-prompt-cleanup.test.ts"

[tasks."test:pi-tool-discovery"]
description = "Test T3 on-demand tool activation and the installed Pi/T3 bridge"
dir = "{{env.HOME}}/dotfiles"
run = "node --test .pi/agent/tests/t3-tool-discovery*.test.ts"

[settings]
dotfiles.root = "~/dotfiles"
dotfiles.relative_symlinks = true
experimental = true
env_cache = true
auto_update = true

[settings.npm]
package_manager = "aube"
